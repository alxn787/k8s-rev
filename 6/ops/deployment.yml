apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: backend-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: alxn787/k8sdep:3
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: env-file
              mountPath: /app/secret
              readOnly: true
      volumes:
        - name: secret-volume
          persistentVolumeClaim:
            claimName: backend-pvc
