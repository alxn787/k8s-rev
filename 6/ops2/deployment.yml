apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-volume-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shared-volume-app
  template:
    metadata:
      labels:
        app: shared-volume-app
    spec:
      containers:
        - name: writer
          image: busybox
          command: ["bin/sh", "-c", "echo 'Hello, World!' > /data/hello.txt; sleep 100"]
          volumeMounts:
            - name: shared-data
              mountPath: /data
        - name: reader
          image: busybox
          command: ["bin/sh", "-c", "cat /data/hello.txt; sleep 100"]
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          emptyDir: {}

          # this is ephemeral volume . it dies with the pod and data is lost.